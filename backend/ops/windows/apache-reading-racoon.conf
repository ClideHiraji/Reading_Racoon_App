# Reading Racoon on Apache 2.4 (XAMPP / Apache Lounge, mod_php), D-036.
# Docs: docs/deploy/home-server.md, "Web server".
#
# Include it at the END of C:\xampp\apache\conf\httpd.conf:
#     Define RR_BACKEND "C:/ReadingRacoon/backend"
#     Include "C:/ReadingRacoon/backend/ops/windows/apache-reading-racoon.conf"
#
# Apache listens on the loopback address only. The tunnel connector
# (cloudflared or tailscaled) on this laptop is the one way in from the
# internet, so nobody on the home or school network can reach PHP directly
# or forge X-Forwarded-For (backend/config/trustedproxy.php).

# 8090, not 8080: the PostgreSQL installer's Enterprise Manager (PEMHTTPD) often holds 8080.
<IfDefine !RR_PORT>
    Define RR_PORT 8090
</IfDefine>

Listen 127.0.0.1:${RR_PORT}

<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !reqtimeout_module>
    LoadModule reqtimeout_module modules/mod_reqtimeout.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>

# Say as little as possible about the server.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Windows' one worker process: threads serve requests side by side, so one
# slow request (a teacher's video upload) never blocks a classroom's syncs,
# which is the reason `php artisan serve` (one request at a time) is not used.
<IfModule mpm_winnt_module>
    ThreadsPerChild 80
    MaxConnectionsPerChild 0
</IfModule>

# Slow or stalled clients are dropped instead of holding a thread (slowloris).
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>
Timeout 120
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 200

<VirtualHost 127.0.0.1:${RR_PORT}>
    ServerName localhost
    DocumentRoot "${RR_BACKEND}/public"

    <Directory "${RR_BACKEND}/public">
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        # Laravel's front controller (the same rules as public/.htaccess).
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Only public/ is the document root, so .env, storage/ and vendor/ have no
    # URL at all; dot-files inside public/ are refused too.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Teacher video uploads (CONTENT_MAX_VIDEO_MB=50) plus form fields.
    LimitRequestBody 62914560

    # Compress JSON and pages; never the Ogg videos.
    AddOutputFilterByType DEFLATE application/json text/html text/css application/javascript

    Header always unset X-Powered-By
    php_admin_flag expose_php Off

    # One file a day, seven kept (rotatelogs ships with Apache): the access log
    # holds client IPs, which are personal data (RA 10173), and Windows has no logrotate.
    ErrorLog "|bin/rotatelogs.exe -n 7 logs/reading-racoon-error.log 86400"
    CustomLog "|bin/rotatelogs.exe -n 7 logs/reading-racoon-access.log 86400" "%{X-Forwarded-For}i %t \"%r\" %>s %b %D"
</VirtualHost>
