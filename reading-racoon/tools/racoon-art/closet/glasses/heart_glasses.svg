   xmlns="http://www.w3.org/2000/svg">
  <title>Golden hearts</title>
  <sodipodi:namedview
     id="namedview-heart_glasses"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="170"
     inkscape:current-layer="layer-item" />
  <defs id="defs-heart_glasses">
    <linearGradient id="gr-heart-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#fff6b8" /><stop offset="0.45" style="stop-color:#ffd84d" /><stop offset="1" style="stop-color:#c98a00" /></linearGradient>
    <linearGradient id="gr-heart-lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#ffc4da" /><stop offset="1" style="stop-color:#ff5d8f" /></linearGradient>
    <linearGradient id="gr-heart-gem128" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#b8fff4" /><stop offset="1" style="stop-color:#1d9d8f" /></linearGradient>
    <linearGradient id="gr-heart-gem273" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#b8fff4" /><stop offset="1" style="stop-color:#1d9d8f" /></linearGradient>
  </defs>
  <g
