<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Reading glasses (copper, glasses). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-round_glasses"
   sodipodi:docname="round_glasses.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Reading glasses</title>
  <sodipodi:namedview
     id="namedview-round_glasses"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="170"
     inkscape:current-layer="layer-item" />
  <defs id="defs-round_glasses">

  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
    <image
       id="racoon-reference"
       inkscape:label="Racoon (linked from racoon_C_inkscape.svg)"
       xlink:href="../../parts/racoon_C_inkscape.svg"
       x="0"
       y="0"
       width="400"
       height="400"
       preserveAspectRatio="none" />
  </g>
  <g inkscape:groupmode="layer" id="layer-item" inkscape:label="Item">
   <g id="item-round-glasses" inkscape:label="round_glasses">
     <title>Reading glasses: round copper frames (copper)</title>
     <circle id="round-glasses-1" inkscape:label="Lens" cx="158.3" cy="168.1" r="21" style="fill:#d8f1ff;fill-opacity:0.28" />
     <circle id="round-glasses-2" inkscape:label="Lens" cx="242.9" cy="168.1" r="21" style="fill:#d8f1ff;fill-opacity:0.28" />
     <circle id="round-glasses-3" inkscape:label="Frame" cx="158.3" cy="168.1" r="21" style="fill:none;stroke:#3b2d3a;stroke-width:8;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="round-glasses-4" inkscape:label="Frame" cx="242.9" cy="168.1" r="21" style="fill:none;stroke:#3b2d3a;stroke-width:8;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-5" inkscape:label="Bridge" d="M 179 165 Q 200.5 153 222 165" style="fill:none;stroke:#3b2d3a;stroke-width:8;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-6" inkscape:label="Arm left" d="M 137.5 166 L 117 161" style="fill:none;stroke:#3b2d3a;stroke-width:8;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-7" inkscape:label="Arm right" d="M 263.5 166 L 284 161" style="fill:none;stroke:#3b2d3a;stroke-width:8;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="round-glasses-8" inkscape:label="Frame" cx="158.3" cy="168.1" r="21" style="fill:none;stroke:#a8693d;stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="round-glasses-9" inkscape:label="Frame" cx="242.9" cy="168.1" r="21" style="fill:none;stroke:#a8693d;stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-10" inkscape:label="Bridge" d="M 179 165 Q 200.5 153 222 165" style="fill:none;stroke:#a8693d;stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-11" inkscape:label="Arm left" d="M 137.5 166 L 117 161" style="fill:none;stroke:#a8693d;stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-12" inkscape:label="Arm right" d="M 263.5 166 L 284 161" style="fill:none;stroke:#a8693d;stroke-width:4.2;stroke-linejoin:round;stroke-linecap:round" />
     <path id="round-glasses-13" inkscape:label="Glint" d="M 146.3 161 Q 149.3 154 155.3 153" style="fill:none;stroke:#ffffff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:0.85" />
     <path id="round-glasses-14" inkscape:label="Glint" d="M 230.9 161 Q 233.9 154 239.9 153" style="fill:none;stroke:#ffffff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:0.85" />
   </g>
  </g>
</svg>
