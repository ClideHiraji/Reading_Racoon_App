<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Sunglasses (silver, glasses). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-sunglasses"
   sodipodi:docname="sunglasses.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Sunglasses</title>
  <sodipodi:namedview
     id="namedview-sunglasses"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="170"
     inkscape:current-layer="layer-item" />
  <defs id="defs-sunglasses">
    <linearGradient id="gr-sun-lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#6a5aa8" /><stop offset="0.45" style="stop-color:#2f2850" /><stop offset="1" style="stop-color:#3f7fa0" /></linearGradient>
    <linearGradient id="gr-sun-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff" /><stop offset="1" style="stop-color:#a3b1be" /></linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
    <image
       id="racoon-reference"
       inkscape:label="Racoon (linked from racoon_C_inkscape.svg)"
       xlink:href="../../parts/racoon_C_inkscape.svg"
       x="0"
       y="0"
       width="400"
       height="400"
       preserveAspectRatio="none" />
  </g>
  <g inkscape:groupmode="layer" id="layer-item" inkscape:label="Item">
   <g id="item-sunglasses" inkscape:label="sunglasses">
     <title>Sunglasses: dark lenses with a silver brow bar (silver)</title>
     <path id="sunglasses-1" inkscape:label="Lens" d="M 134.3 150 C 136.3 147 156.3 147 171.3 148 C 179.3 149 182.3 153 181.3 160 C 180.3 174 173.3 187 158.3 187 C 143.3 188 134.3 179 134.3 168 Z" style="fill:url(#gr-sun-lens);stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sunglasses-2" inkscape:label="Reflection" d="M 146.3 158 L 156.3 176" style="fill:none;stroke:#ffffff;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round;opacity:0.5" />
     <path id="sunglasses-3" inkscape:label="Reflection 2" d="M 155.3 157 L 160.3 166" style="fill:none;stroke:#ffffff;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;opacity:0.45" />
     <path id="sunglasses-4" inkscape:label="Lens" d="M 266.9 150 C 264.9 147 244.9 147 229.9 148 C 221.9 149 218.9 153 219.9 160 C 220.9 174 227.9 187 242.9 187 C 257.9 188 266.9 179 266.9 168 Z" style="fill:url(#gr-sun-lens);stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sunglasses-5" inkscape:label="Reflection" d="M 254.9 158 L 244.9 176" style="fill:none;stroke:#ffffff;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round;opacity:0.5" />
     <path id="sunglasses-6" inkscape:label="Reflection 2" d="M 245.9 157 L 240.9 166" style="fill:none;stroke:#ffffff;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;opacity:0.45" />
     <path id="sunglasses-7" inkscape:label="Bridge" d="M 181 157 Q 200.5 149 220 157" style="fill:none;stroke:#3b2d3a;stroke-width:5.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sunglasses-8" inkscape:label="Brow bar" d="M 133 150 C 150 144 180 145 200.5 149 C 221 145 251 144 268 150 C 268 155 265 156 262 155 C 245 151 222 152 200.5 155 C 179 152 156 151 139 155 C 136 156 133 155 133 150 Z" style="fill:url(#gr-sun-bar);stroke:#3b2d3a;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round" />
   </g>
  </g>
</svg>
