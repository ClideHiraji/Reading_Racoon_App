<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: River scarf (copper, neck). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it.
     A scarf: Band and Stripe narrow with his neck; the rest (ends, Knot) travels with the knot.
     Other scarves (Sunset, Mango, Rainbow) are recolours of this one, set in closet.json. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-scarf_teal"
   sodipodi:docname="scarf_teal.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>River scarf</title>
  <sodipodi:namedview
     id="namedview-scarf_teal"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="280"
     inkscape:current-layer="layer-item" />
  <defs id="defs-scarf_teal">
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#45b8a9" id="s-teal-0" />
      <stop offset="1" style="stop-color:#2a9d8f" id="s-teal-1" />
    </linearGradient>
    <linearGradient id="g-teal-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#2a9d8f" id="s-tealdeep-0" />
      <stop offset="1" style="stop-color:#1d7166" id="s-tealdeep-1" />
    </linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
