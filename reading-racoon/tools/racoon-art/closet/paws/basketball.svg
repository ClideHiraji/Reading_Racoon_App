<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Basketball (silver, paws). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-basketball"
   sodipodi:docname="basketball.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Basketball</title>
  <sodipodi:namedview
     id="namedview-basketball"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="200"
     inkscape:current-layer="layer-item" />
  <defs id="defs-basketball">
    <radialGradient id="gr-basketball-1" cx="0.38" cy="0.32" r="0.75"><stop offset="0" style="stop-color:#ffb06a" /><stop offset="1" style="stop-color:#d9661f" /></radialGradient>
    <radialGradient id="gr-basketball-2" cx="0.38" cy="0.32" r="0.75"><stop offset="0" style="stop-color:#ffb06a" /><stop offset="1" style="stop-color:#d9661f" /></radialGradient>
  </defs>
