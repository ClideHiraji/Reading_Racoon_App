<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Golden book (gold, paws). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it.
     In his paws, in the open book's place. The hidden "Back view" group shows when he turns his back. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-golden_book"
   sodipodi:docname="golden_book.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Golden book</title>
  <sodipodi:namedview
     id="namedview-golden_book"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="320"
     inkscape:current-layer="layer-item" />
  <defs id="defs-golden_book">
    <linearGradient id="gr-gbook-cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#fff0a0" /><stop offset="0.4" style="stop-color:#ffd84d" /><stop offset="1" style="stop-color:#c98a00" /></linearGradient>
    <linearGradient id="gr-gbook-page" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#fffdf2" /><stop offset="0.75" style="stop-color:#fff3c4" /><stop offset="1" style="stop-color:#f2d27a" /></linearGradient>
    <linearGradient id="gr-gbook-page-r" x1="1" y1="0" x2="0" y2="0"><stop offset="0" style="stop-color:#fffdf2" /><stop offset="0.75" style="stop-color:#fff3c4" /><stop offset="1" style="stop-color:#f2d27a" /></linearGradient>
    <linearGradient id="gr-gbook-star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff6b8" /><stop offset="1" style="stop-color:#f2a516" /></linearGradient>
    <radialGradient id="gr-gbook-emblem" cx="0.5" cy="0.5" r="0.5"><stop offset="0" style="stop-color:#fff6b8" /><stop offset="1" style="stop-color:#e0a20c" /></radialGradient>
  </defs>
  <g
