     <path id="golden-book-18" inkscape:label="Star" d="M 200.27 313.31 Q 200.6 312.5 200.93 313.31 L 202.62 317.46 Q 202.95 318.26 203.82 318.33 L 208.29 318.66 Q 209.16 318.72 208.49 319.28 L 205.07 322.17 Q 204.4 322.74 204.61 323.58 L 205.68 327.93 Q 205.89 328.78 205.15 328.32 L 201.34 325.96 Q 200.6 325.5 199.86 325.96 L 196.05 328.32 Q 195.31 328.78 195.52 327.93 L 196.59 323.58 Q 196.8 322.74 196.13 322.17 L 192.71 319.28 Q 192.04 318.72 192.91 318.66 L 197.38 318.33 Q 198.25 318.26 198.58 317.46 Z" style="fill:#fffbe0;stroke:#c98a00;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round" />
