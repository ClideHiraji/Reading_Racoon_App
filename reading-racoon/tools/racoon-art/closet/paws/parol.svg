     <path id="parol-8" inkscape:label="Crease" d="M 200.6 327 L 167.68 371.3" style="fill:none;stroke:#e9801f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:0.6" />
     <path id="parol-9" inkscape:label="Crease" d="M 200.6 327 L 147.34 308.7" style="fill:none;stroke:#e9801f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:0.6" />
     <circle id="parol-10" inkscape:label="Centre" cx="200.6" cy="327" r="7.5" style="fill:url(#gr-parol-centre);stroke:#3b2d3a;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="parol-11" inkscape:label="Twinkle" d="M 156 282 Q 157.68 286.32 162 288 Q 157.68 289.68 156 294 Q 154.32 289.68 150 288 Q 154.32 286.32 156 282 Z" style="fill:#fffbe0;stroke:#d08ad8;stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round" />
