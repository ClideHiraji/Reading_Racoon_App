     <g id="parol-13" inkscape:label="Back view" style="display:none">
     <path id="parol-14" inkscape:label="Star" d="M 200.6 270 L 216.07 304.71 L 253.86 308.7 L 225.63 334.13 L 233.52 371.3 L 200.6 352.32 L 167.68 371.3 L 175.57 334.13 L 147.34 308.7 L 185.13 304.71 Z" style="fill:url(#gr-parol-paper);stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="parol-15" inkscape:label="Centre" cx="200.6" cy="327" r="7.5" style="fill:#7d55a0;stroke:#3b2d3a;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round" />
