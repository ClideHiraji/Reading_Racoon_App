<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Parol lantern (violet, paws). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it.
     In his paws, in the open book's place. The hidden "Back view" group shows when he turns his back. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-parol"
   sodipodi:docname="parol.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Parol lantern</title>
  <sodipodi:namedview
     id="namedview-parol"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="320"
     inkscape:current-layer="layer-item" />
  <defs id="defs-parol">
    <linearGradient id="gr-parol-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffd36e" /><stop offset="0.5" style="stop-color:#ff8a5c" /><stop offset="1" style="stop-color:#e2603f" /></linearGradient>
    <linearGradient id="gr-parol-glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fffbe0" /><stop offset="1" style="stop-color:#ffd36e" /></linearGradient>
    <linearGradient id="gr-parol-centre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#d6b3f0" /><stop offset="1" style="stop-color:#7d55a0" /></linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
    <image
       id="racoon-reference"
       inkscape:label="Racoon (linked from racoon_C_inkscape.svg)"
       xlink:href="../../parts/racoon_C_inkscape.svg"
       x="0"
       y="0"
       width="400"
       height="400"
       preserveAspectRatio="none" />
  </g>
  <g inkscape:groupmode="layer" id="layer-item" inkscape:label="Item">
   <g id="item-parol" inkscape:label="parol">
     <title>Parol lantern: a Filipino Christmas star lantern that glows (violet)</title>
     <path id="parol-1" inkscape:label="Tail" d="M 164.68 371.3 C 173.68 379.3 165.68 385.3 171.68 393.3 L 164.68 394.3 C 158.68 385.3 166.68 379.3 170.68 371.3 Z" style="fill:#ffd84d;stroke:#3b2d3a;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round" />
