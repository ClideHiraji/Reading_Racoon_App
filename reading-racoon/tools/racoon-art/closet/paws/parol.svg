     <path id="parol-3" inkscape:label="Star" d="M 200.6 270 L 216.07 304.71 L 253.86 308.7 L 225.63 334.13 L 233.52 371.3 L 200.6 352.32 L 167.68 371.3 L 175.57 334.13 L 147.34 308.7 L 185.13 304.71 Z" style="fill:url(#gr-parol-paper);stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
