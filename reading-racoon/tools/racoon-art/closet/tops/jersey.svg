<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Basketball jersey (silver, tops). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-jersey"
   sodipodi:docname="jersey.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Basketball jersey</title>
  <sodipodi:namedview
     id="namedview-jersey"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="200"
     inkscape:current-layer="layer-item" />
  <defs id="defs-jersey">
    <linearGradient id="gr-jersey-1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#3e72a9" /><stop offset="0.3" style="stop-color:#3f86c8" /><stop offset="0.55" style="stop-color:#5695cf" /><stop offset="1" style="stop-color:#3e72a9" /></linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
    <image
       id="racoon-reference"
       inkscape:label="Racoon (linked from racoon_C_inkscape.svg)"
       xlink:href="../../parts/racoon_C_inkscape.svg"
       x="0"
       y="0"
       width="400"
       height="400"
       preserveAspectRatio="none" />
  </g>
  <g inkscape:groupmode="layer" id="layer-item" inkscape:label="Item">
   <g id="item-jersey" inkscape:label="jersey">
     <title>Basketball jersey: a blue jersey with white trim and a ball (silver)</title>
     <path id="jersey-1" inkscape:label="Jersey" d="M 112 234 L 289 234 L 289 350 C 252.5 364 148.5 364 112 350 Z" style="fill:url(#gr-jersey-1);stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="jersey-2" inkscape:label="Neck trim" d="M 176 250 L 200.5 281 L 225 250" style="fill:none;stroke:#3b2d3a;stroke-width:11;stroke-linejoin:round;stroke-linecap:round" />
     <path id="jersey-3" inkscape:label="Neck trim" d="M 176 250 L 200.5 281 L 225 250" style="fill:none;stroke:#ffffff;stroke-width:7;stroke-linejoin:round;stroke-linecap:round" />
     <path id="jersey-4" inkscape:label="Arm trim" d="M 146.5 248 C 160.5 262 160.5 284 148.5 300" style="fill:none;stroke:#ffffff;stroke-width:6;stroke-linejoin:round;stroke-linecap:round;opacity:0.95" />
     <path id="jersey-5" inkscape:label="Side stripe" d="M 150.5 304 L 150.5 354" style="fill:none;stroke:#ffd23f;stroke-width:6;stroke-linejoin:round;stroke-linecap:round" />
     <path id="jersey-6" inkscape:label="Arm trim" d="M 254.5 248 C 240.5 262 240.5 284 252.5 300" style="fill:none;stroke:#ffffff;stroke-width:6;stroke-linejoin:round;stroke-linecap:round;opacity:0.95" />
     <path id="jersey-7" inkscape:label="Side stripe" d="M 250.5 304 L 250.5 354" style="fill:none;stroke:#ffd23f;stroke-width:6;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="jersey-8" inkscape:label="Ball" cx="200.5" cy="312" r="15" style="fill:#f08a3c;stroke:#3b2d3a;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round" />
     <path id="jersey-9" inkscape:label="Seams" d="M 200.5 297 L 200.5 327 M 185.5 312 L 215.5 312 M 190 301 C 196 306 196 318 190 323 M 211 301 C 205 306 205 318 211 323" style="fill:none;stroke:#3b2d3a;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round" />
   </g>
  </g>
</svg>
