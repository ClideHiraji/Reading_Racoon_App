<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Sailor top (violet, tops). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-sailor-top"
   sodipodi:docname="sailor_top.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Sailor top</title>
  <sodipodi:namedview
     id="namedview-sailor-top"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="200"
     inkscape:current-layer="layer-item" />
  <defs id="defs-sailor-top">
    <linearGradient id="gr-sailor-top-1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#e0dcd8" /><stop offset="0.3" style="stop-color:#fbf8f2" /><stop offset="0.55" style="stop-color:#fbf9f4" /><stop offset="1" style="stop-color:#e0dcd8" /></linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
    <image
       id="racoon-reference"
       inkscape:label="Racoon (linked from racoon_C_inkscape.svg)"
       xlink:href="../../parts/racoon_C_inkscape.svg"
       x="0"
       y="0"
       width="400"
       height="400"
       preserveAspectRatio="none" />
  </g>
  <g inkscape:groupmode="layer" id="layer-item" inkscape:label="Item">
   <g id="item-sailor-top" inkscape:label="sailor_top">
     <title>Sailor top: a white top with a navy sailor collar (violet)</title>
     <path id="sailor-top-1" inkscape:label="Shirt" d="M 112 234 L 289 234 L 289 346 C 252.5 360 148.5 360 112 346 Z" style="fill:url(#gr-sailor-top-1);stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sailor-top-2" inkscape:label="Sailor collar" d="M 128 242 L 273 242 L 262 264 L 200.5 304 L 139 264 Z" style="fill:#2d3e6b;stroke:#3b2d3a;stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sailor-top-3" inkscape:label="Collar stripe" d="M 146 260 L 200.5 296 L 255 260" style="fill:none;stroke:#ffffff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sailor-top-4" inkscape:label="Neckerchief" d="M 190 294 L 211 294 L 206 316 L 200.5 322 L 195 316 Z" style="fill:#e2574c;stroke:#3b2d3a;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="sailor-top-5" inkscape:label="Knot" cx="200.5" cy="296" r="5" style="fill:#e2574c;stroke:#3b2d3a;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round" />
     <path id="sailor-top-6" inkscape:label="Hem band" d="M 112 340 L 289 340 L 289 348 C 252.5 358 148.5 358 112 348 Z" style="fill:#2d3e6b" />
     <path id="sailor-top-7" inkscape:label="Shine" d="M 150 270 C 148 288 148 304 152 320" style="fill:none;stroke:#ffffff;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:0.35" />
   </g>
  </g>
</svg>
