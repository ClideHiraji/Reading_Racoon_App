<?xml version="1.0" encoding="UTF-8"?>
<!-- Racoon's Closet: Heart pin (silver, pins). FR-07, D-026.
     Drawn to fit Racoon at rest: the bottom layer links ../../parts/racoon_C_inkscape.svg (locked).
     Draw on the "Item" layer. The file's name is the item's id; its name, tier, price and how it's
     earned are in reading-racoon/content/closet.json. motion-demo/build_racoon.py reads this file
     and never writes it. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg-pin_heart"
   sodipodi:docname="pin_heart.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <title>Heart pin</title>
  <sodipodi:namedview
     id="namedview-pin_heart"
     pagecolor="#fefde0"
     bordercolor="#666666"
     inkscape:document-units="px"
     inkscape:zoom="2"
     inkscape:cx="200"
     inkscape:cy="312"
     inkscape:current-layer="layer-item" />
  <defs id="defs-pin_heart">
    <linearGradient id="gr-pinheart-disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#ffffff" /><stop offset="0.5" style="stop-color:#d3dbe3" /><stop offset="1" style="stop-color:#8e9aa6" /></linearGradient>
    <linearGradient id="gr-pinheart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffb3a1" /><stop offset="1" style="stop-color:#e2603f" /></linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     id="layer-reference"
     inkscape:label="Racoon (reference)"
     sodipodi:insensitive="true">
    <image
       id="racoon-reference"
       inkscape:label="Racoon (linked from racoon_C_inkscape.svg)"
       xlink:href="../../parts/racoon_C_inkscape.svg"
       x="0"
       y="0"
       width="400"
       height="400"
       preserveAspectRatio="none" />
  </g>
  <g inkscape:groupmode="layer" id="layer-item" inkscape:label="Item">
   <g id="item-pin-heart" inkscape:label="pin_heart" transform="matrix(1.35 0 0 1.35 -60.9 -109.2)">
     <title>Heart pin: a coral heart on silver (silver)</title>
     <circle id="pin-heart-1" inkscape:label="Pin" cx="174" cy="312" r="16.5" style="fill:url(#gr-pinheart-disc);stroke:#3b2d3a;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round" />
     <circle id="pin-heart-2" inkscape:label="Ring" cx="174" cy="312" r="13" style="fill:#fbfcfd;stroke:#8e9aa6;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round" />
     <path id="pin-heart-3" inkscape:label="Heart" d="M 174 320.53 C 171.5 318.02 164 313.84 164 308.81 C 164 304.63 167.33 302.53 170.25 302.53 C 172.33 302.53 173.58 303.79 174 305.47 C 174.42 303.79 175.67 302.53 177.75 302.53 C 180.67 302.53 184 304.63 184 308.81 C 184 313.84 176.5 318.02 174 320.53 Z" style="fill:url(#gr-pinheart);stroke:#3b2d3a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round" />
     <path id="pin-heart-4" inkscape:label="Shine" d="M 168 310 Q 169 307 172 307" style="fill:none;stroke:#ffffff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round" />
   </g>
  </g>
</svg>
